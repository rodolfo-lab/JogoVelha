<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="headStyle.css">
    <link rel="stylesheet" href="mensagemTela.css">
    <link rel="stylesheet" href="tableJogoVelha.css">

</head>
<body>
    <script src="jogoVelha.js"></script>

    <header id="titulo-tela">
        <h1>Jogo da Velha</h1>
    </header>


    <div class="mensagem-msg" id="mensagem-msg">
        <div class="mensagem-txt">
            <p id="texto-mensagem">Olá! Esta é uma mensagem na tela.</p>
            <button id="fechar-btn" onclick="reiniciarJogo()" >Reiniciar</button>
        </div>
    </div>

    <table>
        <caption id="titulo-board"></caption>

        <table id="game-board">
            <tr>
                <td id="1" onclick="marcarConformeClick(1)"></td>
                <td id="2" onclick="marcarConformeClick(2)"></td>
                <td id="3" onclick="marcarConformeClick(3)"></td>
            </tr>
            <tr>
                <td id="4" onclick="marcarConformeClick(4)"></td>
                <td id="5" onclick="marcarConformeClick(5)"></td>
                <td id="6" onclick="marcarConformeClick(6)"></td>
            </tr>
            <tr>
                <td id="7" onclick="marcarConformeClick(7)"></td>
                <td id="8" onclick="marcarConformeClick(8)"></td>
                <td id="9" onclick="marcarConformeClick(9)"></td>
            </tr>
        </table>

    </table>

    <button id="reiniciar" onclick="reiniciarJogo()">Reiniciar Jogo</button>

</body>
</html>
